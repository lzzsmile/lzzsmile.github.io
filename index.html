<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>应用入口调整</title></head>
<body>
<main><h1>Days Matter 已迁到独立网址</h1><p><a href="./days-matter/">打开念念 · Days Matter</a></p><p>此根地址留待后续导航页使用，不会自动跳转。旧记录没有删除，请在新网址查看迁移提示。</p></main>
<script>
// Update only an already-installed legacy Days Matter worker; do not register a root worker.
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(regs => Promise.all(regs.filter(reg => new URL(reg.scope).pathname === '/' && [reg.active, reg.waiting, reg.installing].some(worker => worker && new URL(worker.scriptURL).pathname === '/sw.js')).map(reg => reg.update().catch(() => {})))).catch(() => {});
</script>
</body></html>
